# Copy only the settings you want into ~/.codex/config.toml.
# bootstrap-codex.sh deliberately does not overwrite an existing config file.

approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"

# Budget-conscious default for everyday coding. Use `-m gpt-5.6-terra`
# explicitly for a harder task instead of making the expensive model global.
model = "gpt-5.6-luna"
model_reasoning_effort = "low"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "low"

# Project instructions are already named AGENTS.md in this repository.
project_doc_max_bytes = 65536
